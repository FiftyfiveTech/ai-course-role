id: password-reset-lockout
title: "Password reset lockout"
difficulty: easy
icon: "🔒"
goal: "Verify identity through appropriate channels, walk the customer through account recovery, and avoid making security promises the trainee can't back up"
situation: "The customer is locked out of their account after too many failed login attempts, and can't use the password-reset email because they've also lost access to that email address."
persona:
  name: Casey
  policy: persona_password_reset_lockout_v1.md
  opening: "You just connected. Explain that you're locked out of your account, and that the password-reset email option won't work because you no longer have access to that email address."
